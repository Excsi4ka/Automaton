name: Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Add future JVM services here and in the publish matrix below.
        service: [core, orchestrator]

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: ${{ matrix.service }}_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ${{ matrix.service }}_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SERVICE: ${{ matrix.service }}
      TEST_DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.service }}_test
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test and package application
        working-directory: ${{ matrix.service }}
        run: bash ./gradlew clean build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/build/reports/tests/
            ${{ matrix.service }}/build/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Build application image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            "${SERVICE}"
          docker save --output "${RUNNER_TEMP}/${SERVICE}-image.tar" "${image}:sha-${GITHUB_SHA}"

      - name: Upload verified image
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  verify-platform:
    name: Verify platform
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all service verifications to succeed
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFICATION_RESULT" != "success" ]; then
            echo "::error::Service verification ended with ${VERIFICATION_RESULT}"
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.service }}
    needs: verify-platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [core, orchestrator]
    env:
      SERVICE: ${{ matrix.service }}

    steps:
      - name: Download verified image
        uses: actions/download-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/images

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish verified image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          docker load --input "${RUNNER_TEMP}/images/${SERVICE}-image.tar"
          docker push "${image}:sha-${GITHUB_SHA}"
          docker tag "${image}:sha-${GITHUB_SHA}" "${image}:latest"
          docker push "${image}:latest"
