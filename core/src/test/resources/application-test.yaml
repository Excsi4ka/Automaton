spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/core_test}
    username: ${TEST_DB_USER:core_test}
    password: ${TEST_DB_PASSWORD:core_test}

core:
  security:
    issuer: http://localhost:8080
    audience: core
    user:
      email: test@example.invalid
      password: core-test-password
    service-client:
      client-id: core-test-client
      client-secret: core-test-client-secret
      audience: orchestrator

  orchestrator:
    url: http://localhost:9999

  jwt:
    # Fixed RSA pair for tests only.
    public-key: 
    private-key: 
    key-id: core-test-key
