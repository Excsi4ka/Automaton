spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/core_test}
    username: ${TEST_DB_USER:core_test}
    password: ${TEST_DB_PASSWORD:core_test}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9998/realms/automaton-test
          jwk-set-uri: http://localhost:9998/realms/automaton-test/protocol/openid-connect/certs
          audiences: core
      client:
        registration:
          core-service:
            client-id: core-test-client
            client-secret: core-test-client-secret
            scope: tasks:submit,tasks:read
        provider:
          keycloak:
            token-uri: http://localhost:9998/realms/automaton-test/protocol/openid-connect/token

core:
  orchestrator:
    url: http://localhost:9999
