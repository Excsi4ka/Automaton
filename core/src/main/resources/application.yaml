spring:
  application:
    name: core

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: ${KEYCLOAK_AUDIENCE:core}
      client:
        registration:
          core-service:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:core-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: ${KEYCLOAK_CLIENT_SCOPES:tasks:submit,tasks:read}
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token

core:
  orchestrator:
    # A url to an orchestrator service or its load balancer
    url: ${ORCHESTRATOR_URL}
